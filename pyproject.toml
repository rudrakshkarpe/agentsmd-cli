[project]
name = "agentsmd"
version = "0.0.1"
description = "Version-controlled authoring and self-improvement for AGENTS.md"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Rudraksh Karpe" },
  { name = "Satyam Soni" },
]
dependencies = []  # stdlib-only skeleton by design

[project.scripts]
agentsmd = "agentsmd.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentsmd", "agentsmd.adapters"]
