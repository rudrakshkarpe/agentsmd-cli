[project]
name = "agentsmd"
version = "0.0.1"
description = "Version-controlled authoring and self-improvement for AGENTS.md"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
  { name = "Rudraksh Karpe" },
  { name = "Satyam Soni" },
]
dependencies = []  # stdlib-only skeleton by design

[project.optional-dependencies]
dev = [
  "build",
  "mypy>=1.17,<2",
  "ruff",
  "twine",
]

[project.scripts]
agentsmd = "agentsmd.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentsmd", "agentsmd.adapters"]

[tool.setuptools.data-files]
"share/agentsmd/templates" = ["templates/*.md"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["build", "dist"]
